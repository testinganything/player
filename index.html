<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0c; --surface: #111116; --border: #1e1e28; --border2: #2a2a38;
      --text: #e8e8f0; --muted: #5a5a78; --accent: #ff2d55; --accent2: #ff6b35;
      --glow: rgba(255,45,85,.18); --green: #30d158; --green-dim: rgba(48,209,88,.12);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }
    body { display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; opacity: .5;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 1;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
      pointer-events: none;
    }
    .page { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 48px 24px 64px; gap: 36px; flex: 1; }
    header { text-align: center; }
    .wordmark {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -.03em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; filter: drop-shadow(0 0 24px var(--glow));
    }
    .tagline { margin-top: 6px; font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }

    /* mode toggle */
    .mode-row { display: flex; gap: 8px; align-items: center; }
    .mode-label { font-size: .68rem; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    .toggle-wrap { display: flex; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; overflow: hidden; }
    .toggle-btn {
      font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .08em;
      padding: 6px 14px; border: none; background: transparent; color: var(--muted);
      cursor: pointer; transition: background .15s, color .15s; white-space: nowrap;
    }
    .toggle-btn.active { background: var(--border2); color: var(--text); }
    .toggle-btn:hover:not(.active) { color: var(--text); }

    /* search */
    .search-wrap { width: 100%; max-width: 700px; }
    .search-bar {
      display: flex; border: 1.5px solid var(--border2); border-radius: 6px;
      overflow: hidden; background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
    }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    #urlInput {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'DM Mono', monospace;
      font-size: .88rem; padding: 14px 18px; min-width: 0;
    }
    #urlInput::placeholder { color: var(--muted); }
    #playBtn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; cursor: pointer; padding: 0 24px; color: #fff;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: .9rem;
      letter-spacing: .04em; display: flex; align-items: center; gap: 8px;
      transition: opacity .15s, filter .15s; white-space: nowrap;
    }
    #playBtn:hover { filter: brightness(1.12); }
    #playBtn:active { opacity: .85; }
    .play-icon { width: 14px; height: 14px; fill: #fff; }
    .hints { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      font-size: .68rem; letter-spacing: .06em; padding: 4px 10px;
      border-radius: 3px; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; transition: border-color .15s, color .15s; user-select: none;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    #errorMsg {
      display: none; background: rgba(255,45,85,.12); border: 1px solid rgba(255,45,85,.35);
      color: var(--accent); border-radius: 6px; padding: 10px 16px;
      font-size: .8rem; margin-top: 10px; letter-spacing: .03em;
    }

    /* player */
    #playerWrap { width: 100%; max-width: 900px; display: none; flex-direction: column; gap: 12px; animation: fadeUp .4s ease both; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
    .player-shell {
      width: 100%; aspect-ratio: 16/9;
      border: 1.5px solid var(--border2); border-radius: 8px;
      overflow: hidden; background: #000;
      box-shadow: 0 4px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
    }
    #playerFrame { width: 100%; height: 100%; border: none; display: block; }

    .player-meta { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; flex-wrap: wrap; gap: 8px; }
    #nowPlaying { font-size: .75rem; color: var(--muted); letter-spacing: .06em; }
    #nowPlaying span { color: var(--text); }
    .meta-right { display: flex; gap: 8px; align-items: center; }

    .open-yt {
      font-size: .72rem; color: var(--muted); text-decoration: none;
      letter-spacing: .06em; border: 1px solid var(--border2);
      padding: 4px 10px; border-radius: 3px; transition: border-color .15s, color .15s;
    }
    .open-yt:hover { border-color: var(--accent); color: var(--accent); }

    #nextInstanceBtn {
      display: none; font-size: .72rem; color: var(--muted); letter-spacing: .06em;
      border: 1px solid var(--border2); padding: 4px 10px; border-radius: 3px;
      background: transparent; cursor: pointer; font-family: 'DM Mono', monospace;
      transition: border-color .15s, color .15s;
    }
    #nextInstanceBtn:hover { border-color: var(--accent2); color: var(--accent2); }
    #nextInstanceBtn.visible { display: block; }

    /* status bar */
    #statusBar {
      display: none; border-radius: 6px; padding: 10px 16px;
      font-size: .76rem; line-height: 1.6; letter-spacing: .02em;
    }
    #statusBar.info { background: var(--green-dim); border: 1px solid rgba(48,209,88,.25); color: #6bcf8a; }
    #statusBar.warn { background: rgba(255,107,53,.07); border: 1px solid rgba(255,107,53,.25); color: #c0805a; }
    #statusBar strong { color: inherit; filter: brightness(1.3); }

    .bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(100px); opacity: .07; }
    .orb1 { width: 500px; height: 500px; background: var(--accent); top:-120px; left:-120px; }
    .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom:-100px; right:-100px; }
    footer { position: relative; z-index: 2; text-align: center; padding: 24px; font-size: .68rem; letter-spacing: .08em; color: var(--muted); border-top: 1px solid var(--border); }
    @media (max-width: 540px) {
      .page { padding: 32px 16px 48px; gap: 24px; }
      #playBtn { padding: 0 16px; font-size: .82rem; }
      #urlInput { font-size: .82rem; padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="page">
  <header>
    <div class="wordmark">YT_PLAYER</div>
    <div class="tagline">Paste any YouTube link &middot; Hit play</div>
  </header>

  <!-- Mode Toggle -->
  <div class="mode-row">
    <span class="mode-label">Mode:</span>
    <div class="toggle-wrap">
      <button class="toggle-btn" id="modeYT" onclick="setMode('youtube')">YouTube</button>
      <button class="toggle-btn active" id="modeInv" onclick="setMode('invidious')">Invidious (age bypass)</button>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-bar">
      <input id="urlInput" type="text"
        placeholder="youtube.com/watch?v=… or youtu.be/… or /shorts/…"
        autocomplete="off" spellcheck="false" />
      <button id="playBtn" onclick="loadVideo()">
        <svg class="play-icon" viewBox="0 0 16 16"><path d="M3 2.5l11 5.5-11 5.5V2.5z"/></svg>
        PLAY
      </button>
    </div>
    <div class="hints">
      <span class="chip" onclick="fillExample('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">watch?v=</span>
      <span class="chip" onclick="fillExample('https://youtu.be/dQw4w9WgXcQ')">youtu.be/</span>
      <span class="chip" onclick="fillExample('https://www.youtube.com/shorts/dQw4w9WgXcQ')">shorts/</span>
      <span class="chip" onclick="fillExample('https://www.youtube.com/live/dQw4w9WgXcQ')">live/</span>
      <span class="chip" onclick="fillExample('https://www.youtube.com/playlist?list=PLbpi6ZahtOH6Ar_3GPy3workRraRtbBf0')">playlist</span>
      <span class="chip" onclick="fillExample('dQw4w9WgXcQ')">video ID</span>
    </div>
    <div id="errorMsg"></div>
  </div>

  <div id="playerWrap">
    <div class="player-shell">
      <iframe id="playerFrame" src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <div class="player-meta">
      <div id="nowPlaying">NOW PLAYING &mdash; <span id="videoIdDisplay"></span></div>
      <div class="meta-right">
        <button id="nextInstanceBtn" onclick="tryNextInstance()">&#8635; Try next instance</button>
        <a id="openYT" class="open-yt" href="#" target="_blank" rel="noopener">&#x2197; OPEN IN YOUTUBE</a>
      </div>
    </div>
    <div id="statusBar"></div>
  </div>
</div>

<footer>YT_PLAYER &mdash; single HTML file &middot; host free on GitHub Pages or Netlify</footer>

<script>
  // ── Invidious instances (tried in order, cycle on failure) ─────────────────
  // These are the officially listed + commonly working instances
  var INVIDIOUS_INSTANCES = [
    'inv.nadeko.net',
    'invidious.nerdvpn.de',
    'yewtu.be',
    'iv.ggtyler.dev',
    'invidious.privacyredirect.com',
    'invidious.slipfox.xyz',
  ];

  var currentMode = 'invidious';  // default to bypass mode
  var currentInstanceIdx = 0;
  var currentParsed = null;

  // ── Mode toggle ────────────────────────────────────────────────────────────
  function setMode(mode) {
    currentMode = mode;
    document.getElementById('modeYT').classList.toggle('active', mode === 'youtube');
    document.getElementById('modeInv').classList.toggle('active', mode === 'invidious');
    if (currentParsed) loadVideo();
  }

  // ── URL Parser ─────────────────────────────────────────────────────────────
  function parseYouTubeInput(raw) {
    raw = (raw || '').trim();
    if (!raw) return null;
    var url;
    try {
      var withProto = raw.startsWith('http') ? raw : 'https://' + raw;
      url = new URL(withProto);
    } catch(e) {
      if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return { type: 'video', id: raw };
      return null;
    }
    var host = url.hostname.replace(/^(www\.|m\.)/, '');
    var path = url.pathname;

    if (host === 'youtu.be') {
      var id = path.slice(1).split('/')[0].split('?')[0];
      if (isValidId(id)) return { type: 'video', id: id, start: parseStart(url) };
    }
    if (host !== 'youtube.com' && host !== 'youtube-nocookie.com') return null;

    if (path === '/watch') {
      var v = url.searchParams.get('v');
      var list = url.searchParams.get('list');
      if (list) return { type: 'playlist', id: list, videoId: v || null, start: parseStart(url) };
      if (isValidId(v)) return { type: 'video', id: v, start: parseStart(url) };
    }
    var m;
    m = path.match(/^\/shorts\/([A-Za-z0-9_-]{11})/);
    if (m) return { type: 'video', id: m[1], start: parseStart(url) };
    m = path.match(/^\/live\/([A-Za-z0-9_-]{11})/);
    if (m) return { type: 'video', id: m[1] };
    m = path.match(/^\/embed\/([A-Za-z0-9_-]{11})/);
    if (m) return { type: 'video', id: m[1], start: parseStart(url) };
    m = path.match(/^\/v\/([A-Za-z0-9_-]{11})/);
    if (m) return { type: 'video', id: m[1] };
    m = path.match(/^\/e\/([A-Za-z0-9_-]{11})/);
    if (m) return { type: 'video', id: m[1] };
    if (path === '/playlist') {
      var l = url.searchParams.get('list');
      if (l) return { type: 'playlist', id: l };
    }
    if (/^\/(user|c|channel|\@)/.test(path)) {
      return { type: 'unsupported', reason: 'Channel pages cannot be embedded — paste a specific video link.' };
    }
    return null;
  }

  function isValidId(id) { return id && /^[A-Za-z0-9_-]{11}$/.test(id); }

  function parseStart(url) {
    var t = url.searchParams.get('t') || url.searchParams.get('start');
    if (!t) return 0;
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    var s = 0;
    var h = t.match(/(\d+)h/); if (h) s += parseInt(h[1]) * 3600;
    var mn = t.match(/(\d+)m/); if (mn) s += parseInt(mn[1]) * 60;
    var sec = t.match(/(\d+)s/); if (sec) s += parseInt(sec[1]);
    return s;
  }

  // ── Build embed URLs ───────────────────────────────────────────────────────
  function buildYouTubeEmbed(parsed) {
    var params = new URLSearchParams({ autoplay: '1', rel: '0', modestbranding: '1' });
    if (parsed.type === 'playlist') {
      params.set('listType', 'playlist');
      params.set('list', parsed.id);
      if (parsed.videoId) return 'https://www.youtube-nocookie.com/embed/' + parsed.videoId + '?' + params;
      return 'https://www.youtube-nocookie.com/embed/videoseries?' + params;
    }
    if (parsed.start) params.set('start', parsed.start);
    return 'https://www.youtube-nocookie.com/embed/' + parsed.id + '?' + params;
  }

  function buildInvidiousEmbed(parsed, instanceIdx) {
    var inst = INVIDIOUS_INSTANCES[instanceIdx % INVIDIOUS_INSTANCES.length];
    var base = 'https://' + inst;
    if (parsed.type === 'playlist') {
      var params = new URLSearchParams({ autoplay: '1', list: parsed.id, local: 'true' });
      if (parsed.videoId) return base + '/embed/' + parsed.videoId + '?' + params;
      return base + '/embed/videoseries?' + params;
    }
    var params = new URLSearchParams({ autoplay: '1', local: 'true' });
    if (parsed.start) params.set('t', parsed.start);
    return base + '/embed/' + parsed.id + '?' + params;
  }

  // ── Load video ─────────────────────────────────────────────────────────────
  function loadVideo() {
    var raw = document.getElementById('urlInput').value;
    hideError();

    var parsed = parseYouTubeInput(raw);
    if (!parsed) { showError("Couldn't recognise that URL. Try a youtube.com/watch?v=… or youtu.be/… link."); return; }
    if (parsed.type === 'unsupported') { showError(parsed.reason); return; }

    currentParsed = parsed;
    currentInstanceIdx = 0;
    renderPlayer(parsed);
  }

  function renderPlayer(parsed) {
    var embedUrl = currentMode === 'invidious'
      ? buildInvidiousEmbed(parsed, currentInstanceIdx)
      : buildYouTubeEmbed(parsed);

    var ytUrl = parsed.type === 'playlist'
      ? 'https://www.youtube.com/playlist?list=' + parsed.id
      : 'https://www.youtube.com/watch?v=' + parsed.id + (parsed.start ? '&t=' + parsed.start : '');

    var label = parsed.type === 'playlist' ? 'PLAYLIST — ' + parsed.id : parsed.id;

    document.getElementById('playerFrame').src = embedUrl;
    document.getElementById('videoIdDisplay').textContent = label;
    document.getElementById('openYT').href = ytUrl;

    // Show/hide next instance button and status
    var nextBtn = document.getElementById('nextInstanceBtn');
    var statusBar = document.getElementById('statusBar');

    if (currentMode === 'invidious') {
      var inst = INVIDIOUS_INSTANCES[currentInstanceIdx % INVIDIOUS_INSTANCES.length];
      nextBtn.classList.add('visible');
      statusBar.style.display = 'block';
      statusBar.className = 'info';
      statusBar.innerHTML = '<strong>Invidious mode ON</strong> &mdash; using <strong>' + inst + '</strong> &middot; age bypass active &middot; if video fails, click "Try next instance"';
    } else {
      nextBtn.classList.remove('visible');
      statusBar.style.display = 'block';
      statusBar.className = 'warn';
      statusBar.innerHTML = '<strong>YouTube mode</strong> &mdash; age-restricted videos will NOT play here. Switch to <strong>Invidious mode</strong> above to bypass.';
    }

    var wrap = document.getElementById('playerWrap');
    wrap.style.display = 'flex';
    wrap.style.animation = 'none';
    wrap.offsetHeight;
    wrap.style.animation = '';
    setTimeout(function() { wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
  }

  function tryNextInstance() {
    if (!currentParsed) return;
    currentInstanceIdx = (currentInstanceIdx + 1) % INVIDIOUS_INSTANCES.length;
    renderPlayer(currentParsed);
  }

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  function fillExample(url) {
    document.getElementById('urlInput').value = url;
    document.getElementById('urlInput').focus();
  }

  document.getElementById('urlInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadVideo();
  });

  window.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(window.location.search);
    var preload = params.get('url') || params.get('v');
    if (preload) { document.getElementById('urlInput').value = preload; loadVideo(); }
  });
</script>
</body>
</html>
